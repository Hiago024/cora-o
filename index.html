<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coração Azul de Partículas</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>

  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let width, height, centerX, centerY, heartScale;

    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
      centerX = width / 2;
      centerY = height / 2 - 20;
      heartScale = Math.min(width, height) / 45;
    }
    window.addEventListener('resize', resize);
    resize();

    // Paleta azul original com os tons exatos de azul neon do vídeo
    const BLUE_SHADES = ['#38a2f6', '#00a8ff', '#256beb', '#8fe0fe', '#00d2ff', '#ffffff'];

    // Equação paramétrica do coração real
    function getHeartPosition(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      return { x, y };
    }

    const HEART_PARTICLES_COUNT = 400;
    const particles = [];

    // Estado da animação: 0 = Formando/Aparecendo, 1 = Desfazendo/Explodindo
    let state = 0; 
    let stateTimer = 0;

    class Particle {
      constructor() {
        this.t = Math.random() * Math.PI * 2;
        const pos = getHeartPosition(this.t);
        
        this.targetX = pos.x;
        this.targetY = pos.y;
        
        this.x = (Math.random() - 0.5) * width;
        this.y = (Math.random() - 0.5) * height;

        this.vx = 0;
        this.vy = 0;

        this.size = Math.random() * 2.2 + 1.2;
        this.color = BLUE_SHADES[Math.floor(Math.random() * BLUE_SHADES.length)];
        this.alpha = Math.random() * 0.85 + 0.15;
      }

      update() {
        if (state === 0) {
          // Surgindo no formato perfeito de coração
          const tx = centerX + this.targetX * heartScale;
          const ty = centerY + this.targetY * heartScale;

          const dx = tx - this.x;
          const dy = ty - this.y;

          this.vx += dx * 0.035;
          this.vy += dy * 0.035;
          this.vx *= 0.80;
          this.vy *= 0.80;

          this.x += this.vx;
          this.y += this.vy;
        } else {
          // Desfazendo-se e espalhando em feixes brilhantes
          this.x += this.vx;
          this.y += this.vy;
          this.vx *= 0.95;
          this.vy *= 0.95;
        }
      }

      draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }

      burst() {
        // Disparo para se desfazer
        const angle = Math.atan2(this.y - centerY, this.x - centerX) + (Math.random() - 0.5);
        const force = Math.random() * 16 + 6;
        this.vx = Math.cos(angle) * force;
        this.vy = Math.sin(angle) * force - Math.random() * 8;
      }
    }

    for (let i = 0; i < HEART_PARTICLES_COUNT; i++) {
      particles.push(new Particle());
    }

    // Portal/Base Oval Iluminada na Base
    function drawBasePortal() {
      const portalY = centerY + 18 * heartScale;
      const portalWidth = 15 * heartScale;
      const portalHeight = 3.5 * heartScale;

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      const gradient = ctx.createRadialGradient(
        centerX, portalY, 2,
        centerX, portalY, portalWidth
      );
      gradient.addColorStop(0, 'rgba(0, 210, 255, 1)');
      gradient.addColorStop(0.35, 'rgba(37, 107, 235, 0.7)');
      gradient.addColorStop(0.7, 'rgba(56, 162, 246, 0.3)');
      gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.ellipse(centerX, portalY, portalWidth, portalHeight, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function animate() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.22)';
      ctx.fillRect(0, 0, width, height);

      ctx.globalCompositeOperation = 'lighter';

      drawBasePortal();

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      stateTimer++;

      if (state === 0 && stateTimer > 110) {
        state = 1;
        stateTimer = 0;
        particles.forEach(p => p.burst());
      } else if (state === 1 && stateTimer > 75) {
        state = 0;
        stateTimer = 0;
      }

      requestAnimationFrame(animate);
    }

    window.addEventListener('pointerdown', () => {
      state = 1;
      stateTimer = 0;
      particles.forEach(p => p.burst());
    });

    animate();
  </script>
</body>
</html>
